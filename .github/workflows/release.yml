name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_suffix: linux-amd64
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/${{ matrix.asset_suffix }}
          BIN_NAME=spaces-publisher
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME=spaces-publisher.exe
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset_suffix }}/${BIN_NAME}" .
          cp README.md LICENSE "dist/${{ matrix.asset_suffix }}/"

      - name: Archive release bundle
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          BASE="spaces-publisher-${VERSION}-${{ matrix.asset_suffix }}"
          mv "${{ matrix.asset_suffix }}" "${BASE}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            zip -r "${BASE}.zip" "${BASE}"
          else
            tar -czf "${BASE}.tar.gz" "${BASE}"
          fi

      - name: Upload matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaces-publisher-${{ matrix.asset_suffix }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: spaces-publisher-checksums
          path: dist/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
